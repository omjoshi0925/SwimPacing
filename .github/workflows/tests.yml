name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run quick suite (slow ODE and real-data tests deselected)
        # requires_data covers tests that assert properties of the gitignored
        # real dataset; a clean checkout cannot see it. See tests/conftest.py.
        run: python -m pytest tests -q -m "not slow and not requires_data"
