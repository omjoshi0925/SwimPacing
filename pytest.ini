[pytest]
markers =
    slow: minute-scale tests that re-solve ODE optima live; deselect with -m "not slow"
    requires_data: needs the gitignored real dataset under data/; asserts a
        property of it (published benchmark values, frozen artifact counts)
        that a synthetic fixture cannot supply without fabricating the check.
        Deselect with -m "not requires_data"; CI always does.
